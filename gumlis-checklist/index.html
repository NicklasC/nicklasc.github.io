  <script>
    var flet = {
      pyodide: true,
      multiView: false,
      noCdn: false,
      webSocketEndpoint: "/ws",
      entrypointBaseUrl: "/gumlis-checklist/",
      assetBase: "/gumlis-checklist/",
      routeUrlStrategy: "path",
      canvasKitBaseUrl: "canvaskit/",
      pyodideUrl: "pyodide/pyodide.js",
      pythonModuleName: "main",

      fontFallbackBaseUrl: "assets/fonts/", // for Noto Emoji, use Google CDN

    flet.flutterAppLoaded = new Promise((resolve) => {
      flet.flutterAppResolve = resolve;
    });

    flet.flutterAppLoaded.then((flutterApp) => {
      console.log("Flutter app loaded");
    });
  </script>
  <script src="python.js"></script>
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #080F0B;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #080F0B;
          }
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>

<body>
  <div id="error-console" style="display:none; position:fixed; top:0; left:0; width:100%; max-height:50%; overflow-y:auto; background:rgba(255, 0, 0, 0.9); color:white; font-family:monospace; font-size:12px; z-index:999999; padding:10px; box-sizing:border-box; border-bottom:3px solid black;">
    <div style="font-weight:bold; margin-bottom:5px; font-size:14px;">🚨 Appfel upptäckt:</div>
    <pre id="error-console-text" style="margin:0; white-space:pre-wrap;"></pre>
    <button onclick="document.getElementById('error-console').style.display='none'" style="margin-top:10px; padding:5px 10px; background:white; color:red; border:none; font-weight:bold; cursor:pointer;">Stäng</button>
  </div>
  <script>
    function showError(msg, err) {
      var consoleDiv = document.getElementById('error-console');
      var textPre = document.getElementById('error-console-text');
      if (consoleDiv && textPre) {
        consoleDiv.style.display = 'block';
        textPre.innerText += msg + '\n' + (err && err.stack ? err.stack : '') + '\n\n';
      }
    }
    window.onerror = function(message, source, lineno, colno, error) {
      showError('JS Error: ' + message + ' at ' + source + ':' + lineno + ':' + colno, error);
      return false;
    };
    window.addEventListener('unhandledrejection', function(event) {
      showError('Unhandled Promise Rejection: ' + event.reason, event.reason);
    });
  </script>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  <script src="flutter_bootstrap.js" async=""></script>



</body></html>
